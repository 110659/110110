<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校园外卖 · 后台管理</title>
<style>
:root{--yel:#FFD100;--red:#FF3000;--grn:#0a9d5c;--bg:#F4F5F7;--ink:#222}
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--ink)}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1d222b,#2c3444);display:flex;align-items:center;justify-content:center;z-index:99}
.lg-box{background:#fff;border-radius:18px;padding:40px 44px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lg-logo{width:56px;height:56px;border-radius:14px;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
.lg-t{text-align:center;font-size:20px;font-weight:800;margin-bottom:4px}
.lg-s{text-align:center;color:#999;font-size:12px;margin-bottom:24px}
.lg-in{width:100%;border:1px solid #E3E5E8;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px;outline:none}
.lg-in:focus{border-color:var(--yel)}
.lg-btn{width:100%;background:var(--yel);border:none;border-radius:10px;padding:13px 0;font-size:15px;font-weight:800;cursor:pointer}
.lg-err{color:var(--red);font-size:12px;text-align:center;min-height:18px;margin-top:8px}
.lg-hint{background:#FFF8E0;border-radius:8px;padding:10px 12px;font-size:12px;color:#8a6a3a;margin-top:10px;line-height:1.7}
#app{display:none;min-height:100vh}
.top{background:#fff;border-bottom:1px solid #E8EAED;display:flex;align-items:center;padding:0 24px;height:56px;position:sticky;top:0;z-index:10}
.tp-logo{width:34px;height:34px;border-radius:9px;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:10px}
.tp-t{font-size:16px;font-weight:800}
.tp-live{margin-left:18px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grn);background:#E8F8EF;border-radius:20px;padding:5px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grn);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.tp-user{margin-left:auto;font-size:13px;color:#666}
.tp-role{color:#fff;border-radius:6px;padding:3px 10px;font-size:12px;margin-right:10px}
.r-admin{background:var(--red)}.r-kefu{background:var(--grn)}
.tp-out{color:var(--red);cursor:pointer;font-size:13px}
.wrap{display:flex}
.side{width:200px;background:#fff;min-height:calc(100vh - 56px);padding:14px 10px;border-right:1px solid #E8EAED}
.sd-g{font-size:11px;color:#999;padding:12px 16px 4px}
.sd-i{padding:11px 16px;border-radius:10px;font-size:14px;color:#555;cursor:pointer;margin-bottom:3px;display:flex;align-items:center;gap:9px}
.sd-i.on{background:#FFF6D6;color:#8a6a00;font-weight:800}
.sd-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
.main{flex:1;padding:20px 24px}
.card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:16px}
.c-t{font-size:15px;font-weight:800;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.st{border-radius:14px;padding:18px;color:#fff}
.st .v{font-size:28px;font-weight:900}
.st .k{font-size:12px;opacity:.85;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F7F8FA;text-align:left;padding:10px 12px;color:#666;font-weight:600;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #F2F3F5;vertical-align:middle}
tr:hover td{background:#FFFEF5}
.tag{display:inline-block;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600}
.tg-grn{background:#E8F8EF;color:var(--grn)}.tg-org{background:#FFF1E5;color:#FF7A00}
.tg-red{background:#FFF1F1;color:var(--red)}.tg-blu{background:#EAF1FF;color:#3a6bd6}.tg-gry{background:#F0F1F3;color:#888}
.btn{border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
.b-ok{background:var(--grn);color:#fff}.b-no{background:#fff;color:#888;border:1px solid #ddd}
.b-rd{background:var(--red);color:#fff}.b-y{background:var(--yel);color:#6b5600}
.b-bl{background:#3a6bd6;color:#fff}
.b-sm{padding:5px 10px;font-size:12px;margin-right:6px}
.star{color:#FFB300}
.chip{display:inline-block;background:#F2F3F5;border-radius:16px;padding:5px 14px;font-size:12px;color:#555;cursor:pointer;margin-right:8px}
.chip.on{background:#FFF3C2;color:#8a5c00;font-weight:700}
.chat-row{display:flex;height:460px}
.chat-users{width:240px;border-right:1px solid #F0F0F0;overflow-y:auto}
.cu{padding:13px 16px;cursor:pointer;border-bottom:1px solid #F5F6F7}
.cu.on{background:#FFF8DC}
.cu-n{font-size:14px;font-weight:700}
.cu-m{font-size:12px;color:#999;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-main{flex:1;display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;background:#FAFAFB}
.msg{max-width:72%;padding:9px 13px;border-radius:12px;font-size:13px;margin-bottom:10px;line-height:1.5}
.msg.me{background:var(--yel);margin-left:auto}
.msg.u{background:#fff;border:1px solid #EBECEE}
.chat-input{display:flex;gap:10px;padding:12px;border-top:1px solid #F0F0F0}
.chat-input input{flex:1;border:1px solid #E3E5E8;border-radius:9px;padding:10px 14px;font-size:13px;outline:none}
.set-in,.f-in{border:1px solid #E3E5E8;border-radius:9px;padding:10px 14px;font-size:13px;outline:none}
.set-row{display:flex;gap:10px;margin-top:10px}
.set-row .set-in{flex:1}
.mut{color:#999;font-size:12px;line-height:1.8}
.todo{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px dashed #eee;font-size:13px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;border-radius:10px;padding:10px 22px;font-size:13px;z-index:99;display:none}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.side{width:64px}.sd-i span,.sd-g,.sd-badge{display:none}}
</style>
</head>

</div>

   写路径：save() → 差异记录打 _t → 防抖 POST /api/push

   前端（小程序）经同一云端库互通：前端下单/评价/售后推 /api/sync，后台推送经 /api/push */
const SYNC_KEYS=['orders','aftersales','reviews','chats','shops','users','acts'];
let PREV_DB=null,DIRTY={},PUSH_T=null,PULLING=false,CLOUD_OK=false;
function cloudOn(){return typeof fetch==='function'}
function stampDB(){
  if(!PREV_DB){PREV_DB=JSON.parse(JSON.stringify(DB));return}
  SYNC_KEYS.forEach(k=>{
    if(!DB[k])return;
    const pm={};(PREV_DB[k]||[]).forEach(r=>{if(r&&r.id)pm[r.id]=JSON.stringify(r)});
    DB[k].forEach(r=>{if(r&&r.id&&pm[r.id]!==JSON.stringify(r)){r._t=Date.now();DIRTY[k]=true}});
  });
  PREV_DB=JSON.parse(JSON.stringify(DB));
}
function save(){stampDB();localStorage.setItem(KEY,JSON.stringify(DB));schedulePush()}
function schedulePush(){if(!cloudOn())return;clearTimeout(PUSH_T);PUSH_T=setTimeout(pushDirty,1200)}
async function pushDirty(){
  if(!cloudOn())return;
  const cols=Object.keys(DIRTY).filter(k=>DIRTY[k]&&Array.isArray(DB[k]));
  if(!cols.length)return;
  DIRTY={};
  const body={};
  cols.forEach(k=>{body[k]=DB[k]});
  try{await fetch('/api/push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({db:body})})}catch(e){}
}
function sortCol(k){
  if(k==='orders')DB.orders.sort((a,b)=>(b._t||b.createdAt||0)-(a._t||a.createdAt||0));
  if(k==='aftersales')DB.aftersales.sort((a,b)=>(b._t||0)-(a._t||0));
}
async function cloudPull(){
  if(!cloudOn()||PULLING||!DB)return;PULLING=true;
  const live=document.getElementById('live-txt');
  try{
    const r=await fetch('/api/db',{cache:'no-store'});
    if(!r.ok)throw new Error('http'+r.status);
    const j=await r.json();
    let changed=false;
    SYNC_KEYS.forEach(k=>{
      const map=j&&j[k];if(!map)return;
      const cur={};(DB[k]||[]).forEach(x=>{if(x&&x.id)cur[x.id]=x});
      let ch=false;
      Object.keys(map).forEach(id=>{
        const rm=map[id];if(!rm)return;
        if(!cur[id]||(rm._t||0)>(cur[id]._t||0)){cur[id]=rm;ch=true}
      });
      if(ch){DB[k]=Object.values(cur);changed=true;sortCol(k)}
    });
    if(changed){PREV_DB=JSON.parse(JSON.stringify(DB));localStorage.setItem(KEY,JSON.stringify(DB));if(['dash','kdash','order','review','after','shop','user','act','chat'].includes(TAB))render()}
    CLOUD_OK=true;if(live)live.textContent='云端已连接 · 与小程序实时互通';
  }catch(e){CLOUD_OK=false;if(live)live.textContent='云端未连接 · 本地演示模式（部署 netlify/functions 后与小程序互通）'}
  PULLING=false;
}

}

    <div class="st" style="background:linear-gradient(135deg,#FF6034,#FF3000)"><div class="v">¥${s.avgSpend}</div><div class="k">客单均价</div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="c-t">用户账号管理（账号状态 / 封禁违规 / 优惠券发放收回）</div>
  <table><tr><th>用户</th><th>手机号</th><th>注册时间</th><th>下单数</th><th>周频次</th><th>累计消费</th><th>持券</th><th>状态</th><th>操作</th></tr>
  ${DB.users.map(u=>`<tr><td>${u.name}</td><td>${u.phone}</td><td>${u.reg}</td><td>${u.orders}</td><td>${u.freq}次/周</td><td>¥${u.spend}</td><td>${u.coupons}张</td>
    <td>${u.status==='正常'?'<span class="tag tg-grn">正常</span>':'<span class="tag tg-red">封禁 · '+(u.reason||'')+'</span>'}</td>
    <td><button class="btn b-no b-sm" onclick="giveCoupon('${u.id}')">发券</button><button class="btn b-no b-sm" onclick="takeCoupon('${u.id}')">收券</button>
    ${u.status==='正常'?'<button class="btn b-rd b-sm" onclick="banUser(\''+u.id+'\')">封禁</button>':'<button class="btn b-ok b-sm" onclick="unbanUser(\''+u.id+'\')">解封</button>'}</td></tr>`).join('')}
  </table></div>`;
}
function giveCoupon(id){const u=DB.users.find(x=>x.id===id);const v=prompt('给「'+u.name+'」发放神券面额（元）：','10');if(v){u.coupons++;save();render();toast('已发放 ¥'+v+' 神券给 '+u.name)}}
function takeCoupon(id){const u=DB.users.find(x=>x.id===id);if(u.coupons>0){u.coupons--;save();render();toast('已收回 1 张券')}else toast('该用户无券可收')}
function banUser(id){const u=DB.users.find(x=>x.id===id);const r=prompt('封禁事由（恶意刷单/恶意差评）：','恶意刷单');u.status='封禁';u.reason=r;save();render();toast('「'+u.name+'」已封禁')}
function unbanUser(id){const u=DB.users.find(x=>x.id===id);u.status='正常';u.reason='';save();render();toast('「'+u.name+'」已解封')}
/* ---------- 用户反馈（管理员） ---------- */
function vFeedback(){
  return `<div class="card"><div class="c-t">用户反馈（投诉/建议 · 可分配给客服处理）</div>
  <table><tr><th>用户</th><th>类型</th><th>内容</th><th>时间</th><th>状态</th><th>处理人</th><th>操作</th></tr>
  ${DB.feedbacks.map(f=>`<tr><td>${f.user}</td><td><span class="tag ${f.type==='投诉'?'tg-red':'tg-blu'}">${f.type}</span></td><td style="max-width:280px">${f.text}</td><td>${f.time}</td>
    <td><span class="tag ${f.status==='待分配'?'tg-org':(f.status==='已办结'?'tg-grn':'tg-blu')}">${f.status}</span></td><td>${f.assignee||'-'}</td>
    <td>${f.status==='待分配'?'<button class="btn b-bl b-sm" onclick="assignFB(\''+f.id+'\')">分配给客服</button>':(f.status==='已办结'?'-':'<button class="btn b-ok b-sm" onclick="doneFB(\''+f.id+'\')">标记办结</button>')}</td></tr>`).join('')}
  </table></div>`;
}
function assignFB(id){const f=DB.feedbacks.find(x=>x.id===id);f.status='处理中';f.assignee='kefu';save();render();toast('已分配给客服 kefu 处理')}
function doneFB(id){const f=DB.feedbacks.find(x=>x.id===id);f.status='已办结';save();render();toast('反馈已办结')}
/* ---------- 评价管理 ---------- */
function vReview(){
  const admin=ROLE==='admin';
  return `<div class="card"><div class="c-t">评价管理（${admin?'管理员：删除恶意辱骂/违规评价':'客服：差评沟通与和解（无删除权）'}）</div>
  <table><tr><th>用户</th><th>商户</th><th>星级</th><th>内容</th><th>标签</th><th>操作</th></tr>
  ${DB.reviews.map(r=>`<tr><td>${r.anonymous?'匿名':r.user}</td><td>${r.merchant}</td><td class="star">${'★'.repeat(r.star)}${'☆'.repeat(5-r.star)}</td><td style="max-width:260px">${r.text}</td><td>${(r.tags||[]).map(t=>'<span class="tag tg-gry">'+t+'</span>').join(' ')}</td>
    <td>${admin?(r.hidden?'<span class="tag tg-red">已删除</span>':'<button class="btn b-rd b-sm" onclick="delReview(\''+r.id+'\')">删除</button>'):(r.star<=3?'<button class="btn b-bl b-sm" onclick="goChatReview(\''+(r.anonymous?'匿名用户':r.user)+'\')">差评沟通</button>':'-')}</td></tr>`).join('')}
  </table></div>`;
}
function delReview(id){const r=DB.reviews.find(x=>x.id===id);if(r){r.hidden=true;save();render();toast('违规评价已删除')}}
function goChatReview(user){
  DB.chats.push({id:Date.now(),userId:user+'（差评沟通）',type:'差评沟通',replied:false,log:[{me:false,text:'您好，关于您的差评我们想跟您协商处理'}]});
  save();TAB='chat';render();toast('已发起差评沟通会话');
}
/* ---------- 售后处理 ---------- */
function vAfter(){
  return `<div class="card"><div class="c-t">售后处理（${ROLE==='admin'?'管理员视图':'客服可协助退款，纠纷可上报管理员'}）</div>
  <table><tr><th>售后单</th><th>订单</th><th>商户</th><th>原因</th><th>退款额</th><th>状态</th><th>来源</th><th>操作</th></tr>
  ${DB.aftersales.map(a=>`<tr><td>${a.id}</td><td>${a.orderId}</td><td>${a.merchant}</td><td>${a.reason}</td><td>¥${a.amount}</td>
    <td><span class="tag ${a.status==='退款成功'?'tg-grn':(a.status.indexOf('拒绝')>=0?'tg-red':'tg-org')}">${a.status}</span></td>
    <td>${a.byService?'<span class="tag tg-blu">客服处理</span>':'<span class="tag tg-gry">商家流程</span>'}</td>
    <td>${a.status!=='退款成功'&&a.status.indexOf('拒绝')<0?'<button class="btn b-ok b-sm" onclick="okAfter(\''+a.id+'\')">同意退款</button><button class="btn b-rd b-sm" onclick="noAfter(\''+a.id+'\')">拒绝</button><button class="btn b-bl b-sm" onclick="escAfter(\''+a.id+'\')">上报</button>':'-'}</td></tr>`).join('')}
  </table></div>`;
}
function okAfter(id){const a=DB.aftersales.find(x=>x.id===id);if(a){a.status='退款成功';a.byService=true;save();render();toast('售后 '+id+' 已退款')}else toast('未找到售后单')}
function noAfter(id){const a=DB.aftersales.find(x=>x.id===id);if(a){a.status='已拒绝 · 维持原判';save();render();toast('售后 '+id+' 已拒绝')}else toast('未找到售后单')}
function escAfter(id){const a=DB.aftersales.find(x=>x.id===id);DB.escs.unshift({id:'E'+Date.now(),from:'客服',subject:'售后纠纷：'+id,text:'售后单 '+id+'（'+a.merchant+' · ¥'+a.amount+'）双方无法协商一致，请管理员判定。',status:'待管理员处理',time:'刚刚'});save();render();toast('已上报管理员判定')}
/* ---------- 咨询接待（客服工作台） ---------- */
function vChat(){
  const users=DB.chats;
  if(!CURCHAT&&users.length)CURCHAT=users[0].id;
  const c=users.find(x=>x.id===CURCHAT);
  const kw=[['已为您催促商家，预计10分钟内送达','催单'],['退款已提交，金额将原路退回','退款'],['已补偿¥5神券，可在「神券」页查看','补券'],['您的问题已记录，将上报管理员核实','上报'],['结算账单已同步核对，请查收','结算'],['我们已联系商家协商差评和解，请留意消息','差评']];
  return `<div class="card"><div class="c-t">咨询接待（用户咨询 + 商家咨询 + 差评沟通 + 商家申诉）</div>
  <div class="chat-row">
    <div class="chat-users">${users.map(u=>'<div class="cu '+(u.id===CURCHAT?'on':'')+'" onclick="CURCHAT='+u.id+';render()"><div class="cu-n">'+u.userId+' <span class="tag '+(u.type==='商家申诉'?'tg-red':(u.type.indexOf('商家')>=0?'tg-blu':'tg-grn'))+'" style="font-size:10px">'+u.type+'</span></div><div class="cu-m">'+(u.replied?'':'🟠 ')+u.log[u.log.length-1].text+'</div></div>').join('')}</div>
    <div class="chat-main">
      <div class="chat-msgs" id="msgs">${c?c.log.map(m=>'<div class="msg '+(m.me?'me':'u')+'">'+m.text+'</div>').join(''):'<div style="color:#999;text-align:center;padding-top:200px">选择左侧会话开始接待</div>'}</div>
      <div style="padding:8px 12px;border-top:1px solid #F0F0F0">
        ${c?kw.filter(k=>c.type.indexOf(k[1])>=0||['催单','退款','补券'].includes(k[1])).map(k=>'<span class="chip" onclick="quick(\''+k[0]+'\')">'+k[1]+'</span>').join(''):''}
        ${c&&c.type==='商家申诉'?'<span class="chip" onclick="escChat()" style="background:#FFF1F1;color:#FF3000">⬆️ 上报管理员</span>':''}
      </div>
      <div class="chat-input"><input id="cin" placeholder="输入回复，回车发送…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn b-y" onclick="sendMsg()">发送</button></div>
    </div>
  </div></div>`;
}
function sendMsg(){const i=document.getElementById('cin');const t=i.value.trim();if(!t||!CURCHAT)return;const c=DB.chats.find(x=>x.id===CURCHAT);c.log.push({me:true,text:t});c.replied=true;save();i.value='';render()}
function quick(t){const i=document.getElementById('cin');if(i)i.value=t;sendMsg()}
function escChat(){const c=DB.chats.find(x=>x.id===CURCHAT);if(!c)return;
  DB.escs.unshift({id:'E'+Date.now(),from:'客服',subject:c.type+'：'+c.userId,text:c.log.map(m=>(m.me?'客服：':'对方：')+m.text).join(' / '),status:'待管理员处理',time:'刚刚'});
  save();toast('会话已上报管理员');
}
/* ---------- 上报/申诉 ---------- */
function vReport(){
  const admin=ROLE==='admin';
  if(admin){
    return `<div class="card"><div class="c-t">客服上报 / 商家申诉（管理员判定处理）</div>
    ${DB.escs.map(e=>`<div style="border:1px solid #EEF0F2;border-radius:12px;padding:16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px"><b>${e.subject}</b>
        <span class="tag ${e.status==='待管理员处理'?'tg-org':'tg-grn'}">${e.status}</span>
        <span class="mut" style="margin-left:auto">${e.from} · ${e.time}</span></div>
      <div class="mut" style="margin:10px 0">${e.text}</div>
      ${e.status==='待管理员处理'?`<button class="btn b-ok b-sm" onclick="resolveEsc('${e.id}',1)">✓ 支持（撤销/补正）</button><button class="btn b-rd b-sm" onclick="resolveEsc('${e.id}',0)">✗ 驳回（维持原判）</button>`:''}
    </div>`).join('')||'<div class="mut">暂无上报</div>'}
    </div>`;
  }
  return `<div class="card"><div class="c-t">提交上报（收集证据提交管理员，客服无审批权）</div>
  <div class="set-row"><input class="set-in" id="esc-s" placeholder="上报主题（如：商家XX对处罚有异议）">
  <button class="btn b-ok" onclick="submitEsc()">提交管理员</button></div>
  <textarea class="set-in" id="esc-t" placeholder="问题描述与证据说明…" style="width:100%;height:90px;margin-top:10px"></textarea>
  <div class="mut" style="margin-top:14px">我提交的上报（${DB.escs.length}件）：</div>
  ${DB.escs.map(e=>`<div class="todo"><span>${e.subject}</span><span class="tag ${e.status==='待管理员处理'?'tg-org':'tg-grn'}">${e.status}</span></div>`).join('')}
  </div>`;
}
function resolveEsc(id,ok){const e=DB.escs.find(x=>x.id===id);if(e){e.status=ok?'已支持（已撤销/补正）':'已驳回（维持原判）';save();render();toast(ok?'已支持：相关处罚/账单已调整':'已驳回：维持原判')}}
function submitEsc(){const s=document.getElementById('esc-s'),t=document.getElementById('esc-t');if(!s.value.trim()){toast('请填写主题');return}
  DB.escs.unshift({id:'E'+Date.now(),from:'客服',subject:s.value.trim(),text:t.value.trim(),status:'待管理员处理',time:'刚刚'});
  save();s.value='';t.value='';render();toast('已提交管理员处理');}
/* ---------- 系统设置 ---------- */
function vSet(){
  return `<div class="card"><div class="c-t">云端实时互通（自动）</div>
  <div class="mut">· 后台每3秒自动拉取云端库，操作后自动推送，与小程序双向实时互通。<br>· 互通数据：订单状态 / 售后进度 / 评价（可删除）/ 商家停业·下架 / 发放优惠券 / 封禁用户。<br>· 需部署本目录的 netlify/functions（随站点一起上传即可）；未部署时为本地演示模式。</div>
  <div class="mut" style="margin-top:8px">同步状态：<span id="live-txt">检测中…</span></div>
  </div>
  <div class="card"><div class="c-t">数据操作</div>
  <button class="btn b-y" onclick="exportDB()">⬇️ 导出数据库 JSON</button>
  <button class="btn b-no" style="margin-left:10px" onclick="resetDB()">🗑️ 重置为种子数据</button></div>
  <div class="card"><div class="c-t">权限说明（需求文档对照）</div>
  <table><tr><th></th><th>商家相关核心</th><th>用户相关核心</th><th>权限特点</th></tr>
  <tr><td><b>管理员</b></td><td>入驻审核、启停商家、抽成、结算打款、处罚清退</td><td>账号封禁、评价审核、发券、数据统计</td><td><span class="tag tg-red">全局决策权</span></td></tr>
  <tr><td><b>客服</b></td><td>商家咨询、订单纠纷对接、申诉收集上报</td><td>售后退款、接待咨询、纠纷协调</td><td><span class="tag tg-blu">仅接待/记录/上报</span></td></tr></table>
  <div class="mut" style="margin-top:10px">校园场景补充：管理员管控商家是否允许进校园、限制配送范围；客服重点处理超时、取餐点冲突、学生投诉。</div></div>`;
}
function setRemote(){REMOTE=document.getElementById('rurl').value.trim();localStorage.setItem('campus_remote',REMOTE);toast(REMOTE?'已保存并开始轮询':'已清空');pollRemote()}
function clearRemote(){REMOTE='';localStorage.removeItem('campus_remote');document.getElementById('live-txt').textContent='本地演示模式'}
function exportDB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='campus-db.json';a.click()}
function resetDB(){DB=JSON.parse(JSON.stringify(SEED));save();CURCHAT=null;render();toast('已重置为种子数据')}
</script>
</body>
</html>
